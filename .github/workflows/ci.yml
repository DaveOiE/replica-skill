name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: app } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Generated files are up to date (schema SQL, migrations module, tokens)
        run: |
          npm run db:generate
          node scripts/gen-tokens.mjs
          git diff --exit-code -- . ':!node_modules'
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and integration tests (engine must be 100% covered)
        run: npx vitest run --coverage
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (real Chromium, offline, two devices, backups)
        run: npx playwright test
      - name: No trace of the original product's name in our code
        run: python3 ../replica-brand/sweep.py . --avoid "NexoPOS,Nexo,Blair2004,nexopos.com"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: 'app/test-results', retention-days: 7 }

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m unittest discover -s tests -v
