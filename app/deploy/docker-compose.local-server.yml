# Mode 2: a mini PC on the shop network. UNTESTED in the spike (no Docker daemon in the build sandbox).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: tillbox
    volumes: [dbdata:/var/lib/postgresql/data]
  sync:
    build: { context: .., dockerfile: deploy/Dockerfile.sync }
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/tillbox
      SYNC_TOKEN: ${SYNC_TOKEN:?set SYNC_TOKEN}
      PORT: "4100"
    ports: ["4100:4100"]
volumes:
  dbdata:
