# Install as /etc/systemd/journald.conf.d/taskapp.conf, then: systemctl restart systemd-journald
# The app, the backup scripts and the alert handler all log to the journal, so this is their log rotation: old entries are
# deleted by age and by size. (The app already leaves out cookies, authorization headers and query strings; the scripts never
# print a secret.) Caddy's access log is rotated by Caddy itself (roll_size, roll_keep, roll_keep_for in the Caddyfile).
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=100M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=2000
