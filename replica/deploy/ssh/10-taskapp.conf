# SSH hardening for this server. Install as /etc/ssh/sshd_config.d/10-taskapp.conf AFTER you have confirmed that logging in with your key works in a second session,
# then check it with `sshd -t` and reload with `systemctl reload ssh` (or sshd). Keep an already-open session until you have tested a new one.
# Replace the placeholder with the account you log in as. Keys only: no passwords, no root login.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
AllowUsers __REPLACE_WITH_YOUR_LOGIN_NAME__
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
