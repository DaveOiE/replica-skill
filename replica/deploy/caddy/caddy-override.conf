# Install as /etc/systemd/system/caddy.service.d/override.conf (systemctl edit caddy does the same).
[Service]
EnvironmentFile=/etc/caddy/taskapp-caddy.env
# Refuse to start while a placeholder is still in the file, or if the file cannot be read at all. The leading + runs this one check as root, so it can read a root-owned
# file; grep exits 0 for "found", 1 for "not found" and 2 for "could not read", and only 1 is acceptable.
ExecStartPre=+/bin/sh -c 'grep -q __REPLACE /etc/caddy/taskapp-caddy.env; [ $? -eq 1 ]'
